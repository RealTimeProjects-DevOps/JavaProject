name: NewTestActions
on: 
  workflow_dispatch:
    inputs:
      target_environment:
        description: Take Input
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
jobs:
  build:
    runs-on: testagent
    steps:
      - name: Checkout Code
        run: |
          echo "running build job"
          echo "printing current workspace"
          echo ${{github.workspace}}

      - name: build code
        run: |
          echo "build java code"
  
  deploy:
    runs-on: testagent
    steps:
      - name: DevDeployment
        if: ${{ inputs.target_environment == 'dev' }}
        run: echo "deploy to dev server"
      - name: QADeployment
        if: ${{ inputs.target_environment == 'qa' }}
        run: echo "deploy to QA server"
      
