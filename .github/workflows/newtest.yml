name: NewTestActions
on: 
  push:
    branches:
      - master
      - dev/*
  workflow_dispatch:
    inputs:
      application_name:
        # description: "Enter application name"
        required: true
        type: string

      run_tests:
        description: "Run tests?"
        required: true
        type: boolean
        default: true

      target_environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
jobs:
  build:
    runs-on: testagent

    steps:
      - name: Checkout Code
        run: |
          echo "running build job"
          echo "printing current workspace"
          echo ${{github.workspace}}

      - name: build code
        id: buildversion
        run: |
          echo "build java code"
          echo "buildid=1.0" >> "$GITHUB_OUTPUT"
      - name: print step output
        run: |
                echo  "build id is ${{ steps.buildversion.outputs.buildid }}"

          
  
  deploy:
    runs-on: testagent
    needs: build
    steps:
      - name: DevDeployment
        if: ${{ inputs.target_environment == 'dev' }}
        run: echo "deploy to dev server"
      - name: QADeployment
        if: ${{ inputs.target_environment == 'qa' }}
        run: echo "deploy to QA server"
      
